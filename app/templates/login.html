{% extends "base.html" %}

{% block title %}FinAssist AI | Login{% endblock %}

{% block content %}
<section class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-5">
      <div class="glass-card p-4 p-lg-5">
        <h2 class="text-white mb-4">Login</h2>
        <form id="loginForm" novalidate>
          <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input type="text" class="form-control" id="username" name="user_name" placeholder="Enter username" required />
          </div>
          <div class="mb-4">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" name="password" placeholder="Enter password" required />
          </div>
          <div id="loginAlert" class="alert d-none" role="alert"></div>
          <button type="submit" class="btn btn-primary w-100">Sign In</button>
        </form>
      </div>
    </div>
  </div>
</section>
{% endblock %}

{% block scripts %}
<script>
  document.addEventListener('DOMContentLoaded', function () {
    const form = document.getElementById('loginForm');
    const alertBox = document.getElementById('loginAlert');

    if (!form || !alertBox) return;

    form.addEventListener('submit', async function (e) {
      e.preventDefault();

      const payload = {
        user_name: document.getElementById('username').value,
        password: document.getElementById('password').value
      };

      try {
        const response = await fetch('/users/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });

        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
          throw new Error(data.detail || 'Login failed.');
        }

        localStorage.setItem('accessToken', data.access_token);
        localStorage.setItem('refreshToken', data.refresh_token);
        localStorage.setItem('conversationId', data.conversation_id);
        localStorage.setItem('user', JSON.stringify(data.user));
        document.cookie = 'access_token=' + encodeURIComponent(data.access_token) + '; path=/; SameSite=Lax';
        document.cookie = 'refresh_token=' + encodeURIComponent(data.refresh_token) + '; path=/; SameSite=Lax';
        document.cookie = 'conversation_id=' + encodeURIComponent(data.conversation_id) + '; path=/; SameSite=Lax';

        alertBox.className = 'alert alert-success';
        alertBox.textContent = data.message || 'Login successful.';
        window.location.replace('/chat');
      } catch (err) {
        alertBox.className = 'alert alert-danger';
        alertBox.textContent = err.message || 'Login failed.';
      }
    });
  });
</script>
{% endblock %}

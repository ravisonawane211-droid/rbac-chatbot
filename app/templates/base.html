<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}FinAssist AI{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="/static/css/style.css" />
    {% block styles %}{% endblock %}
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary">
      <div class="container-fluid px-4">
        <a class="navbar-brand fw-bold text-white" href="/">FinAssist AI</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse justify-content-center" id="mainNav">
          <ul class="navbar-nav align-items-lg-center gap-lg-2 mx-auto">
            <li class="nav-item public-link"><a class="nav-link" href="/home">Home</a></li>
            <li class="nav-item public-link"><a class="nav-link" href="/features">Features</a></li>
            <li class="nav-item public-link"><a class="nav-link" href="/about">About Us</a></li>
            <li class="nav-item public-link"><a class="nav-link" href="/contact">Contact</a></li>
            <li class="nav-item public-link"><a class="nav-link" href="/login">Login</a></li>
            <li class="nav-item auth-link d-none"><a class="nav-link" href="/chat">Chat</a></li>
            <li class="nav-item c-level-link d-none"><a class="nav-link" href="/upload">Upload</a></li>
            <li class="nav-item c-level-link d-none"><a class="nav-link" href="/admin">Admin</a></li>
            <li class="nav-item c-level-link d-none"><a class="nav-link" href="/dashboard">Dashboard</a></li>
            <li class="nav-item ms-lg-3 d-flex align-items-center gap-2">
              <span id="userNavBadge" class="user-nav-badge d-none"></span>
              <button id="logoutBtn" class="btn btn-outline-light btn-sm d-none">Logout</button>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container-fluid py-4">
      {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/app.js"></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
